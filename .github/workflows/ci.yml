name: Verificações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: carla-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --omit=dev
      - run: bash -n scripts/deploy-seguro.sh scripts/configurar-logs.sh
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
